<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif}input,select{font-family:Poppins,sans-serif}</style></helmet>
<div style="font-family:Poppins,sans-serif;color:#123027">

<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">
<button onClick="{{ onBack }}" style="border:1px solid #dbe6df;background:#fff;border-radius:10px;padding:8px 12px;font:500 12.5px Poppins,sans-serif;color:#1f7a51;cursor:pointer" style-hover="background:#f2f8f4">← Indietro</button>
<span style="white-space:nowrap;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.09em;padding:5px 8px;border-radius:6px;background:#e7f3ec;color:#1f7a51">{{ badge }}</span>
<span style="margin-left:auto;font:400 10.5px 'IBM Plex Mono',monospace;color:#8aa39a">6 variabili · setpoint e banda</span>
</div>

<div style="background:#fff;border:1px solid #dbe6df;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px">

<div style="display:grid;grid-template-columns:{{ headCols }};gap:14px">
<label style="display:flex;flex-direction:column;gap:7px">
<span style="font-size:12.5px;color:#5d7a6e">Nome ricetta</span>
<input value="{{ name }}" onChange="{{ setName }}" style="border:1px solid #cfe6d9;background:#f7fbf9;border-radius:11px;padding:11px 13px;font-size:13px;color:#123027;width:100%">
</label>
<label style="display:flex;flex-direction:column;gap:7px">
<span style="font-size:12.5px;color:#5d7a6e">Reparto di riferimento</span>
<select value="{{ refDept }}" onChange="{{ setRefDept }}" style="appearance:none;border:1px solid #cfe6d9;background:#f7fbf9;border-radius:11px;padding:11px 13px;font-size:13px;color:#123027;cursor:pointer;width:100%">
<sc-for list="{{ deptOptions }}" as="d" hint-placeholder-count="4"><option value="{{ d }}">{{ d }}</option></sc-for>
</select>
</label>
<label style="display:flex;flex-direction:column;gap:7px">
<span style="font-size:12.5px;color:#5d7a6e">Fase</span>
<select value="{{ phase }}" onChange="{{ setPhase }}" style="appearance:none;border:1px solid #cfe6d9;background:#f7fbf9;border-radius:11px;padding:11px 13px;font-size:13px;color:#123027;cursor:pointer;width:100%">
<sc-for list="{{ phases }}" as="p" hint-placeholder-count="6"><option value="{{ p }}">{{ p }}</option></sc-for>
</select>
</label>
</div>

<div style="border:1px solid #e2eae5;border-radius:18px;overflow:hidden">
<div style="display:grid;grid-template-columns:1.9fr 1fr .9fr .9fr;gap:12px;padding:12px 18px;background:#f4f8f5;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#5d7a6e">
<span>VARIABILE</span><span>SETPOINT</span><span>MIN</span><span>MAX</span>
</div>
<sc-for list="{{ rows }}" as="v" hint-placeholder-count="6">
<div style="display:grid;grid-template-columns:1.9fr 1fr .9fr .9fr;gap:12px;padding:12px 18px;border-top:1px solid #eef3ef;align-items:center">
<div><div style="font-size:13px;font-weight:500">{{ v.k }}</div><div style="font:400 10.5px 'IBM Plex Mono',monospace;color:#9aada4;margin-top:2px">{{ v.u }}</div></div>
<input value="{{ v.v }}" onChange="{{ v.setV }}" style="border:1px solid #cfe6d9;background:#f7fbf9;border-radius:9px;padding:9px 10px;font:500 12.5px 'IBM Plex Mono',monospace;color:#123027;width:100%">
<input value="{{ v.min }}" onChange="{{ v.setMin }}" style="border:1px solid #cfe6d9;background:#f7fbf9;border-radius:9px;padding:9px 10px;font:400 12.5px 'IBM Plex Mono',monospace;color:#123027;width:100%">
<input value="{{ v.max }}" onChange="{{ v.setMax }}" style="border:1px solid #cfe6d9;background:#f7fbf9;border-radius:9px;padding:9px 10px;font:400 12.5px 'IBM Plex Mono',monospace;color:#123027;width:100%">
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:14px">
<span style="font-size:12px;color:{{ noteColor }};line-height:1.5;flex:1">{{ note }}</span>
<button onClick="{{ save }}" disabled="{{ saving }}" style="{{ saveStyle }}" style-hover="{{ saveHover }}">{{ saveLabel }}</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:620},&quot;recipe&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Recipe&quot;},&quot;isNew&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;deptOptions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const PHASES = ['Propagazione','Vegetativa 1','Vegetativa 2','Fioritura','Fruttificazione','Mantenimento','Riposo secco','Osservazione'];
const NAMES = ['Umidità del terriccio','Luce (PPFD)','pH','Azoto (N)','Fosforo (P)','Potassio (K)'];
const UNITS = ['%','µmol/m²s','pH','ppm','ppm','ppm'];
const BLANK = NAMES.map((k, i) => ({ k, u: UNITS[i], v: '', min: '', max: '', strategy: 'Threshold' }));

class Component extends DCLogic {
  state = { form: null, saving: false, saved: false };
  componentWillUnmount(){ clearTimeout(this._t); }

  form(){
    if (this.state.form) return this.state.form;
    const r = this.props.recipe;
    const isNew = !!this.props.isNew || !r;
    return {
      name: isNew ? '' : (r.name || ''),
      refDept: (isNew ? '' : (r.dept || '')) || (this.props.deptOptions || [''])[0],
      phase: isNew ? PHASES[0] : (r.phase || PHASES[0]),
      rows: isNew ? BLANK.map(x => Object.assign({}, x)) : (r.vars || []).map(x => Object.assign({}, x))
    };
  }
  set(patch){ this.setState({ form: Object.assign({}, this.form(), patch), saved: false }); }
  setRow(i, patch){
    const f = this.form();
    const rows = f.rows.map((x, j) => j === i ? Object.assign({}, x, patch) : x);
    this.set({ rows });
  }

  save(){
    if (this.state.saving) return;
    const isNew = !!this.props.isNew;
    this.setState({ saving: true, saved: false });
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      this.setState({ saving: false, saved: true });
      if (isNew) { this._t = setTimeout(() => (this.props.onBack || (() => {}))(), 5000); }
    }, 1400);
  }

  renderVals(){
    const isNew = !!this.props.isNew;
    const f = this.form();
    const saving = this.state.saving, saved = this.state.saved;
    const label = isNew ? 'Salva ricetta' : 'Modifica ricetta';
    return {
      isNew, badge: isNew ? 'NUOVA RICETTA' : 'MODIFICA',
      headCols: '1.4fr 1.6fr 1fr',
      name: f.name, refDept: f.refDept, phase: f.phase,
      phases: PHASES, deptOptions: this.props.deptOptions || [],
      rows: f.rows.map((v, i) => Object.assign({}, v, {
        setV: (e) => this.setRow(i, { v: e.target.value }),
        setMin: (e) => this.setRow(i, { min: e.target.value }),
        setMax: (e) => this.setRow(i, { max: e.target.value })
      })),
      setName: (e) => this.set({ name: e.target.value }),
      setRefDept: (e) => this.set({ refDept: e.target.value }),
      setPhase: (e) => this.set({ phase: e.target.value }),
      saving, save: () => this.save(),
      saveLabel: saving ? 'Invio al controller…' : (saved ? (isNew ? 'Ricetta salvata ✓' : 'Ricetta modificata ✓') : label),
      note: saving ? 'Attesa conferma dal controller.'
        : (saved ? (isNew ? 'Ricetta salvata: ritorno alla lista ricette tra pochi secondi.' : 'Le modifiche sono state applicate alla ricetta.')
          : 'Setpoint e banda valgono per la fase selezionata; la strategia si imposta in Controllo avanzato.'),
      noteColor: saving ? '#a06a37' : (saved ? '#1f7a51' : '#8aa39a'),
      saveStyle: 'white-space:nowrap;border:none;border-radius:11px;padding:11px 18px;font:500 12.5px Poppins,sans-serif;'
        + (saving ? 'background:#fbf6f2;color:#a06a37;border:1px solid #e6d7cd;cursor:progress'
          : (saved ? 'background:#e7f3ec;color:#1f7a51;border:1px solid #cfe6d9;cursor:default' : 'background:#1f7a51;color:#fff;cursor:pointer')),
      saveHover: saving || saved ? '' : 'background:#14603e',
      onBack: this.props.onBack || (() => {})
    };
  }
}
</script>
</body>
</html>
